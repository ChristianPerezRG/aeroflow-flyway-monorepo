name: Flyway GitHub Actions Production Workflow # Workflow name
# Uses the official Redgate actions (red-gate/setup-flyway + red-gate/flyway-actions).
# No pre-installed Flyway CLI needed - setup-flyway downloads and licenses it per job.
#
# MONOREPO: one workflow for every Flyway project under projects/<Name>/.
# Runs when a pull request is merged into Production. Finds which projects have changed
# migrations in the merge and deploys each of them (a matrix). Projects with no changes
# don't run. The drift and change report for review is produced on the pull request
# itself by deploy-qa.yml.
on:
  push:
    branches:
      - Production
    paths:
      - "projects/*/migrations/**"

# Shared settings - the same for every project
env:
  # Repository Variables - Create these in Settings > Secrets and variables > Actions > Variables
  EMAIL: ${{ vars.USER_EMAIL }} # Email registered to your Flyway license
  # Repository Secrets - Create these in Settings > Secrets and variables > Actions > Secrets
  TOKEN: ${{ secrets.FLYWAY_TOKEN }} # Flyway license token (PAT)

permissions:
  contents: read

jobs:
  # Finds the projects whose migrations changed in this push (the merged pull request).
  # Output: a JSON list such as [{"project":"DemoDB","key":"DEMODB"}] for the matrix below.
  detect:
    name: Detect changed projects
    runs-on: self-hosted
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      any: ${{ steps.detect.outputs.any }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Full history, so this push can be compared with the previous commit

      - name: Detect changed projects
        id: detect
        shell: pwsh
        run: |
          $before = '${{ github.event.before }}'
          git cat-file -e "$before^{commit}" 2>$null
          if ($before -match '^0+$' -or $LASTEXITCODE -ne 0) {
            # Never deploy everything by accident on a new branch or a force push
            throw "Cannot find the previous Production commit ($before) to compare with. Promote with a pull request rather than a force push."
          }
          $changed = @(foreach ($f in (git diff --name-only $before '${{ github.sha }}')) {
            if ($f -match '^projects/([^/]+)/migrations/') { $Matches[1] }
          }) | Sort-Object -Unique
          $items = @(foreach ($p in $changed) {
            if ($p -notmatch '^[A-Za-z0-9_]+$') { throw "Project folder '$p' must use only letters, digits and underscores." }
            [ordered]@{ project = $p; key = $p.ToUpper() }
          })
          Write-Host "Changed projects: $(@($changed) -join ', ')"
          "matrix=$(ConvertTo-Json -InputObject $items -Compress)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "any=$(($items.Count -gt 0).ToString().ToLower())" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

  # GitHub Actions can add a manual approval before this job using environments with
  # required reviewers. Here, the review happens on the pull request (deploy-qa.yml report).

  # Drift check and snapshot are left at their defaults (enabled).
  # Drift is fatal on deploy - an out-of-band hotfix made after the pull request was
  # checked aborts the deployment rather than being silently absorbed into the snapshot.
  flyway-deploy-prod:
    name: Deploy ${{ matrix.project }} to Production
    needs: detect
    if: needs.detect.outputs.any == 'true'
    runs-on: self-hosted # Runner to execute the job
    strategy:
      fail-fast: false # One project failing doesn't cancel the others
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.matrix) }}
    concurrency:
      group: flyway-deploy-prod-${{ matrix.project }} # Never deploy the same project twice at once
      cancel-in-progress: false

    # Credentials. Every project has its own secrets, named with the project folder
    # name upper-cased: DB_USER_PROD1_<NAME> and DB_USER_PW_PROD1_<NAME>.
    env:
      PROJECT: ${{ matrix.project }}
      DB_USER_PROD1: ${{ secrets[format('DB_USER_PROD1_{0}', matrix.key)] }}
      DB_USER_PW_PROD1: ${{ secrets[format('DB_USER_PW_PROD1_{0}', matrix.key)] }}

    steps: # Steps run strictly in order and stop on the first failure
      - uses: actions/checkout@v5 # Checks out the commit that triggered this run

      # Fails fast if the project's secrets or Production database URL are missing
      - name: Check project settings
        shell: pwsh
        run: |
          $missing = @('DB_USER_PROD1', 'DB_USER_PW_PROD1') | Where-Object { -not [Environment]::GetEnvironmentVariable($_) }
          if ($missing) { throw "Project ${env:PROJECT}: create repository secret(s) $(($missing | ForEach-Object { "${_}_${{ matrix.key }}" }) -join ', ')" }
          $toml = Get-Content "projects/$env:PROJECT/flyway.toml" -Raw
          if ($toml -notmatch '(?ms)^\[environments\.production\][^\[]*?^\s*url\s*=\s*"[^"]+"') {
            throw "Project ${env:PROJECT}: add [environments.production] with a url to projects/$env:PROJECT/flyway.toml"
          }

      # NOTE: Windows runners only - not required on Linux runners, where bash is native.
      # Git for Windows' default install puts only Git\cmd on PATH (git.exe, no bash.exe),
      # so `shell: bash` inside the Flyway actions resolves to WSL's bash, which cannot
      # read the Windows script path. This puts Git Bash ahead of it.
      - name: Add Git Bash to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "C:\Program Files\Git\bin" | Out-File $env:GITHUB_PATH -Append -Encoding utf8
          "C:\Program Files\Git\usr\bin" | Out-File $env:GITHUB_PATH -Append -Encoding utf8

      - name: Setup Flyway
        uses: red-gate/setup-flyway@v3
        with:
          version: "13.4.0" # Pin for reproducible runs - bump deliberately
          edition: enterprise
          i-agree-to-the-eula: true
          email: ${{ env.EMAIL }}
          token: ${{ env.TOKEN }}

      # Applies pending migrations. The URL comes from [environments.production] in flyway.toml.
      - name: Deploy to Production
        uses: red-gate/flyway-actions/migrations/deploy@v2
        with:
          working-directory: projects/${{ matrix.project }}
          target-environment: production
          target-user: ${{ env.DB_USER_PROD1 }}
          target-password: ${{ env.DB_USER_PW_PROD1 }}
          deployment-report-name: flyway-prod-deployment-report-${{ matrix.project }}
          drift-resolution-scripts-name: flyway-deploy-prod-drift-resolution-scripts-${{ matrix.project }}
