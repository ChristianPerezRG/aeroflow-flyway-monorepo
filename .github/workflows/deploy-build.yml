name: Flyway GitHub Actions Build Workflow # Workflow name
# Uses the official Redgate actions (red-gate/setup-flyway + red-gate/flyway-actions).
# No pre-installed Flyway CLI needed - setup-flyway downloads and licenses it per job.
# For the equivalent pipeline calling a pre-installed Flyway CLI, see the flyway-cli folder.
#
# MONOREPO: one workflow for every Flyway project under projects/<Name>/.
# The detect job finds which projects have changed migrations in this push, then the
# build job runs once per changed project (a matrix). Adding a project needs no edits here:
# create projects/<Name>/ and the <NAME>-suffixed variables listed below.
on:
  push:
    branches:
      - Development
    paths:
      - "projects/*/migrations/**"

# Shared settings - the same for every project
env:
  # Repository Variables - Create these in Settings > Secrets and variables > Actions > Variables
  EMAIL: ${{ vars.USER_EMAIL }} # Email registered to your Flyway license
  # Repository Secrets - Create these in Settings > Secrets and variables > Actions > Secrets
  TOKEN: ${{ secrets.FLYWAY_TOKEN }} # Flyway license token (PAT)

# Required so the code review results can be uploaded to GitHub Code Scanning
permissions:
  contents: read
  security-events: write

jobs:
  # Finds the projects whose migrations changed in this push.
  # Output: a JSON list such as [{"project":"DemoDB","key":"DEMODB"}] for the matrix below.
  detect:
    name: Detect changed projects
    runs-on: self-hosted
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      any: ${{ steps.detect.outputs.any }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Full history, so this push can be compared with the previous commit

      - name: Detect changed projects
        id: detect
        shell: pwsh
        run: |
          $before = '${{ github.event.before }}'
          $after  = '${{ github.sha }}'
          $all = @(Get-ChildItem projects -Directory | Where-Object { Test-Path (Join-Path $_.FullName 'migrations') } | ForEach-Object Name)
          git cat-file -e "$before^{commit}" 2>$null
          if ($before -match '^0+$' -or $LASTEXITCODE -ne 0) {
            Write-Host "No previous commit to compare with - building every project."
            $changed = $all
          } else {
            $changed = @(foreach ($f in (git diff --name-only $before $after)) {
              if ($f -match '^projects/([^/]+)/migrations/') { $Matches[1] }
            }) | Sort-Object -Unique
          }
          $items = @(foreach ($p in $changed) {
            if ($p -notmatch '^[A-Za-z0-9_]+$') { throw "Project folder '$p' must use only letters, digits and underscores (it becomes part of variable names)." }
            [ordered]@{ project = $p; key = $p.ToUpper() }
          })
          Write-Host "Changed projects: $(@($changed) -join ', ')"
          "matrix=$(ConvertTo-Json -InputObject $items -Compress)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "any=$(($items.Count -gt 0).ToString().ToLower())" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

  flyway-build:
    name: Build ${{ matrix.project }}
    needs: detect
    if: needs.detect.outputs.any == 'true'
    runs-on: self-hosted
    strategy:
      fail-fast: false # One project failing doesn't cancel the others
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.matrix) }}
    concurrency:
      group: flyway-build-${{ matrix.project }} # Never run two builds of the same project at once
      cancel-in-progress: false

    # Per-project settings. For project folder <Name>, create these with the name upper-cased:
    #   Variables: JDBC_BUILD_<NAME>, JDBC_QA_<NAME>, JDBC_CHECK_<NAME>
    #   Optional:  FIRST_UNDO_SCRIPT_<NAME> (otherwise the project's first migration is used)
    #   Optional secrets: DB_USER_BUILD_<NAME>, DB_USER_PW_BUILD_<NAME> (and _QA_, _CHECK_);
    #   when absent, the shared DB_USER_BUILD / DB_USER_PW_BUILD (etc.) secrets are used.
    env:
      PROJECT: ${{ matrix.project }}
      JDBC_BUILD: ${{ vars[format('JDBC_BUILD_{0}', matrix.key)] }} # Wiped every run - must be a throwaway DB
      JDBC_QA: ${{ vars[format('JDBC_QA_{0}', matrix.key)] }} # Target of the pre-deployment check report
      JDBC_CHECK: ${{ vars[format('JDBC_CHECK_{0}', matrix.key)] }} # Throwaway build DB used by the check report
      DB_USER_BUILD: ${{ secrets[format('DB_USER_BUILD_{0}', matrix.key)] || secrets.DB_USER_BUILD }}
      DB_USER_PW_BUILD: ${{ secrets[format('DB_USER_PW_BUILD_{0}', matrix.key)] || secrets.DB_USER_PW_BUILD }}
      DB_USER_QA: ${{ secrets[format('DB_USER_QA_{0}', matrix.key)] || secrets.DB_USER_QA }}
      DB_USER_PW_QA: ${{ secrets[format('DB_USER_PW_QA_{0}', matrix.key)] || secrets.DB_USER_PW_QA }}
      DB_USER_CHECK: ${{ secrets[format('DB_USER_CHECK_{0}', matrix.key)] || secrets.DB_USER_CHECK }}
      DB_USER_PW_CHECK: ${{ secrets[format('DB_USER_PW_CHECK_{0}', matrix.key)] || secrets.DB_USER_PW_CHECK }}
      FIRST_UNDO_OVERRIDE: ${{ vars[format('FIRST_UNDO_SCRIPT_{0}', matrix.key)] }}

    steps: # Steps run strictly in order and stop on the first failure
      - name: Checkout Repository # Checks out the commit that triggered this run
        uses: actions/checkout@v5
        with:
          clean: true # Ensure the workspace is cleaned before the workflow runs

      # Fails fast if this project's connection variables are missing, and works out the
      # version Rollback Build undoes back to (the project's first versioned migration).
      - name: Check project settings
        id: settings
        shell: pwsh
        run: |
          $missing = @('JDBC_BUILD','JDBC_QA','JDBC_CHECK') | Where-Object { -not [Environment]::GetEnvironmentVariable($_) }
          if ($missing) { throw "Project ${env:PROJECT}: create repository variable(s) $(($missing | ForEach-Object { "${_}_${{ matrix.key }}" }) -join ', ')" }
          $undo = $env:FIRST_UNDO_OVERRIDE
          if (-not $undo) {
            $versions = Get-ChildItem "projects/$env:PROJECT/migrations" -Filter 'V*.sql' |
              ForEach-Object { if ($_.Name -match '^V(.+?)__') { $Matches[1] -replace '_', '.' } }
            $undo = $versions | Sort-Object { ($_ -split '\.' | ForEach-Object { $_.PadLeft(20, '0') }) -join '.' } | Select-Object -First 1
          }
          Write-Host "Project: $env:PROJECT | Rollback Build undoes back to version: $undo"
          "first_undo=$undo" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      # NOTE: Windows runners only - not required on Linux runners, where bash is native.
      # Git for Windows' default install puts only Git\cmd on PATH (git.exe, no bash.exe),
      # so `shell: bash` inside the Flyway actions resolves to WSL's bash, which cannot
      # read the Windows script path. This puts Git Bash ahead of it.
      - name: Add Git Bash to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "C:\Program Files\Git\bin" | Out-File $env:GITHUB_PATH -Append -Encoding utf8
          "C:\Program Files\Git\usr\bin" | Out-File $env:GITHUB_PATH -Append -Encoding utf8

      # Installs the Flyway CLI on the runner and adds it to PATH
      - name: Setup Flyway
        uses: red-gate/setup-flyway@v3
        with:
          version: "13.4.0" # Pin for reproducible runs - bump deliberately
          edition: enterprise
          i-agree-to-the-eula: true
          email: ${{ env.EMAIL }}
          token: ${{ env.TOKEN }}

      # reprovision runs the 'clean' provisioner on the build environment first,
      # so this cleans and rebuilds the Build DB from scratch in one step.
      # Requires [environments.build] with provisioner = "clean" in flyway.toml.
      - name: Migrate Build
        uses: red-gate/flyway-actions/migrations/deploy@v2
        with:
          working-directory: projects/${{ matrix.project }}
          target-environment: build
          target-url: ${{ env.JDBC_BUILD }}
          target-user: ${{ env.DB_USER_BUILD }}
          target-password: ${{ env.DB_USER_PW_BUILD }}
          provision-mode: reprovision
          extra-args: -environments.build.flyway.cleanDisabled=false # Allow clean on Build only
          skip-drift-check: true # Build DB is rebuilt each run, so drift is meaningless
          skip-snapshot: true
          deployment-report-name: flyway-build-deployment-report-${{ matrix.project }}
          drift-resolution-scripts-name: flyway-deploy-build-drift-resolution-scripts-${{ matrix.project }}

      # Validates the undo scripts by rolling back what we just deployed
      - name: Rollback Build
        uses: red-gate/flyway-actions/migrations/undo@v2
        with:
          working-directory: projects/${{ matrix.project }}
          target-environment: build
          target-url: ${{ env.JDBC_BUILD }}
          target-user: ${{ env.DB_USER_BUILD }}
          target-password: ${{ env.DB_USER_PW_BUILD }}
          target-migration-version: ${{ steps.settings.outputs.first_undo }}
          skip-drift-check: true
          skip-snapshot: true
          undo-report-name: flyway-build-undo-report-${{ matrix.project }}
          drift-resolution-scripts-name: flyway-undo-build-drift-resolution-scripts-${{ matrix.project }}

      # Pre-deployment check report against QA, for review during the pull request.
      # Code analysis, changes, drift and dry run all run by default - no flags needed.
      # The report is uploaded as a workflow artifact automatically.
      # Runs last, so only after the build migrate/rollback steps have passed.
      - name: Create QA Check Report
        uses: red-gate/flyway-actions/migrations/checks@v2
        with:
          working-directory: projects/${{ matrix.project }}
          target-url: ${{ env.JDBC_QA }}
          target-user: ${{ env.DB_USER_QA }}
          target-password: ${{ env.DB_USER_PW_QA }}
          build-environment: check
          build-url: ${{ env.JDBC_CHECK }}
          build-user: ${{ env.DB_USER_CHECK }}
          build-password: ${{ env.DB_USER_PW_CHECK }}
          build-ok-to-erase: true # Check DB is a throwaway shadow, cleaned each run
          fail-on-drift: false # Surface drift in the report rather than failing the build
          pre-deployment-report-name: flyway-qa-pre-deployment-report-${{ matrix.project }}
          drift-resolution-scripts-name: flyway-checks-qa-drift-resolution-scripts-${{ matrix.project }}
